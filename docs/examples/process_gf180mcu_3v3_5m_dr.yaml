# OpenChippy GF180MCU compatibility process rule deck example
#
# Target:
#   - GlobalFoundries GF180MCU open PDK
#   - 3.3 V core devices
#   - Five routable lower metal layers (Metal1-Metal5)
#
# IMPORTANT:
#   This is an OpenChippy compatibility profile, not a complete foundry-qualified
#   PDK or signoff rule deck. OpenChippy's format currently reduces many
#   conditional GF180 rules to one conservative scalar per layer class.
#   Final GDS must still pass the official GF180MCU DRC, LVS, antenna, density,
#   latch-up, reliability, and tapeout checks.
#
# Primary geometric values are derived from the public GF180MCU design manual.
# Device resistance/capacitance and routing parasitics below are preliminary
# engineering estimates until OpenChippy can import characterized model data.

technology:
  format_version: 1
  name: GF180MCU 3.3V 5M Compatibility
  process_id: gf180mcu-3v3-5m-compat
  deck_revision: openchippy-compat-v1
  source: https://gf180mcu-pdk.readthedocs.io/en/latest/physical_verification/design_manual/Design_Manual.html
  supply_voltage: 3.3
  max_metal_layers: 5

# Caravel-sized user-project allocation. This compatibility template uses the
# complete 2.92 mm x 3.52 mm area and exposes 38 GPIO plus two VDD and two GND
# landing sites (42 total). Pad placement is an OpenChippy integration
# contract, not a claim that GF180 is intrinsically tied to Caravel.
tapeout_window:
  format_version: 1
  name: Caravel-sized GF180 user area
  width_um: 2920.0
  height_um: 3520.0
  edge_margin_um: 0.0
  layout_mode: full_usable_area
  rings:
    - { net: power, layer: 4, width_um: 10.0, inset_um: 20.0 }
    - { net: ground, layer: 3, width_um: 10.0, inset_um: 35.0 }
