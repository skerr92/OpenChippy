      evidence: null

    - id: CAP-GDSII-ROUND-TRIP
      description: Export and re-import canonically equivalent SG13G2 GDSII.
      status: NOT_RUN
      evidence: null

    - id: CAP-NATIVE-LVS
      description: Compare physical devices and connectivity with the logical design.
      status: NOT_RUN
