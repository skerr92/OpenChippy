# OpenChippy IHP SG13G2 process-validation record
#
# This file records qualification evidence for the exact compatibility rule
# deck named below. It intentionally begins with conservative NOT_RUN claims:
# generating a deck from published IHP data is not itself evidence that
# OpenChippy has loaded, exercised, or correlated it against the IHP tools.
#
# The IHP Open PDK currently describes itself as preview/early-access material.
# This record therefore must not be interpreted as foundry signoff.

process_validation:
  format_version: 1

  process:
    process_id: ihp-sg13g2-1v2-5m-compat
    deck_revision: openchippy-compat-v1
    deck_file: process_ihp_sg13g2_1v2_5m_dr.yaml
    deck_fingerprint: "fnv1a64:d5926a20ab8e2b81"
    compatibility_profile: true
    foundry_signoff_deck: false

  record:
    record_id: ihp-sg13g2-1v2-5m-compat-validation-v1
    revision: 1
    generated_on: "2026-07-27"
    overall_status: DOCUMENTED
    highest_supported_claim: DOCUMENTED
    notes:
      - The rule deck is derived from the public SG13G2 layer table and minimal precheck/rejection rules.
      - Filler layer mappings use the published filler datatype 22.
      - Metal fill is temporarily configured with the packaged GF180 compatibility values (2 x 2 um tiles, 1.2 um spacing, 200 x 200 um windows stepped 100 um); this is implementation scaffolding, not IHP qualification evidence.
      - OpenChippy parser tests, native DRC tests, GDS round-trip tests, official IHP DRC, and LVS have not yet been run for this deck.
      - Tiny Tapeout top-level fill and finishing may satisfy requirements that cannot be evaluated inside an individual small macro.
      - Device timing, resistance, capacitance, and routing parasitic entries remain non-signoff estimates.

  capabilities:
    - id: CAP-PROCESS-DECK-LOAD
      description: Parse and validate the versioned IHP compatibility rule deck.
      status: NOT_RUN
