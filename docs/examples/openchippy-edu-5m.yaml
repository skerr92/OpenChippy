# Load this file from Circuit > Active technology > Load YAML.
# Values are educational examples, not a foundry-qualified PDK.
technology:
  format_version: 1
  name: OpenChippy Example EDU 5M
  process_id: openchippy-edu-5m
  deck_revision: example-v1
  source: OpenChippy educational example
  supply_voltage: 1.8
  max_metal_layers: 5

# Caravel's documented SKY130 user-project region is 2.92 mm x 3.52 mm:
# https://caravel-harness.readthedocs.io/en/latest/getting-started.html#user-project-area
# This is a shuttle/harness allocation, not an intrinsic SKY130 process limit.
tapeout_window:
  format_version: 1
  name: Caravel SKY130 user area
  width_um: 2920.0
  height_um: 3520.0
  edge_margin_um: 0.0
  layout_mode: full_usable_area
  # Metal 5 is the process top metal used for external pad landings. The PDN
  # rings sit below it so signal pads do not intersect a perimeter power ring.
  rings:
    - { net: power, layer: 4, width_um: 10.0, inset_um: 20.0 }
    - { net: ground, layer: 3, width_um: 10.0, inset_um: 35.0 }
  # Fixed Caravel-style perimeter sites. GPIO assignment is stored in the
  # project; power and ground sites bind automatically to their rails.
  pads:
    - { id: gpio_left_0, role: gpio, side: left, offset_um: 440.0, width_um: 60.0, height_um: 60.0, layer: 5 }
    - { id: gpio_left_1, role: gpio, side: left, offset_um: 1100.0, width_um: 60.0, height_um: 60.0, layer: 5 }
    - { id: gpio_left_2, role: gpio, side: left, offset_um: 1760.0, width_um: 60.0, height_um: 60.0, layer: 5 }
    - { id: gpio_left_3, role: gpio, side: left, offset_um: 2420.0, width_um: 60.0, height_um: 60.0, layer: 5 }
    - { id: gpio_left_4, role: gpio, side: left, offset_um: 3080.0, width_um: 60.0, height_um: 60.0, layer: 5 }
    - { id: gpio_right_0, role: gpio, side: right, offset_um: 440.0, width_um: 60.0, height_um: 60.0, layer: 5 }
    - { id: gpio_right_1, role: gpio, side: right, offset_um: 1100.0, width_um: 60.0, height_um: 60.0, layer: 5 }
    - { id: gpio_right_2, role: gpio, side: right, offset_um: 1760.0, width_um: 60.0, height_um: 60.0, layer: 5 }
    - { id: gpio_right_3, role: gpio, side: right, offset_um: 2420.0, width_um: 60.0, height_um: 60.0, layer: 5 }
    - { id: gpio_right_4, role: gpio, side: right, offset_um: 3080.0, width_um: 60.0, height_um: 60.0, layer: 5 }
    - { id: vdd_top, role: power, side: top, offset_um: 730.0, width_um: 80.0, height_um: 80.0, layer: 5 }
    - { id: vdd_bottom, role: power, side: bottom, offset_um: 730.0, width_um: 80.0, height_um: 80.0, layer: 5 }
    - { id: gnd_bottom, role: ground, side: bottom, offset_um: 2190.0, width_um: 80.0, height_um: 80.0, layer: 4 }

nmos:
  threshold_voltage: 0.45
  nominal_on_resistance_ohms: 12000.0
  reference_width_um: 1.0
  reference_length_um: 1.0
  gate_capacitance_ff_per_um: 2.0
  diffusion_capacitance_ff_per_um: 1.0

pmos:
  threshold_voltage: -0.45
  nominal_on_resistance_ohms: 22000.0
  reference_width_um: 1.0
  reference_length_um: 1.0
  gate_capacitance_ff_per_um: 2.2
  diffusion_capacitance_ff_per_um: 1.2

physical_parasitics:
  format_version: 1
  wire_capacitance_ff_per_um: 0.16
  via_capacitance_ff: 0.05
  layer_capacitance_ff_per_um:
    metal1: 0.20
    metal2: 0.18
    metal3: 0.16
    metal4: 0.14
    metal5: 0.12
  via_capacitance_overrides_ff:
    via12: 0.060
    via23: 0.055
    via34: 0.050
    via45: 0.045

gds_layers:
  format_version: 1
  label_datatype: 10
  layers:
    substrate: [{ purpose: substrate_preview, layer: 1, datatype: 0 }]
    pwell: [{ purpose: pwell, layer: 20, datatype: 0 }]
    nwell: [{ purpose: nwell, layer: 21, datatype: 0 }]
    ndiff: [{ purpose: ndiff, layer: 22, datatype: 0 }]
    pdiff: [{ purpose: pdiff, layer: 22, datatype: 1 }]
    poly: [{ purpose: poly, layer: 30, datatype: 0 }]
    contact: [{ purpose: contact, layer: 33, datatype: 0 }]
    metal1: [{ purpose: metal1, layer: 34, datatype: 0 }]
    via12: [{ purpose: via12, layer: 35, datatype: 0 }]
    metal2: [{ purpose: metal2, layer: 36, datatype: 0 }]
    via23: [{ purpose: via23, layer: 37, datatype: 0 }]
    metal3: [{ purpose: metal3, layer: 38, datatype: 0 }]
    via34: [{ purpose: via34, layer: 39, datatype: 0 }]
    metal4: [{ purpose: metal4, layer: 40, datatype: 0 }]
    via45: [{ purpose: via45, layer: 41, datatype: 0 }]
    metal5: [{ purpose: metal5, layer: 42, datatype: 0 }]
  # Educational dummy-purpose mappings. Datatype 4 keeps fill distinct from
  # electrically routed shapes in exported GDS and on later import.
  dummy_layers:
    metal5: [{ purpose: metal5_dummy, layer: 42, datatype: 4 }]

physical_rules:
  format_version: 1
  database_units_per_micron: 1000
  manufacturing_grid_um: 0.01
  diffusion: { min_width_um: 0.30, min_spacing_um: 0.30, min_area_um2: 0.09 }
  poly: { min_width_um: 0.20, min_spacing_um: 0.20, min_area_um2: 0.04 }
  well: { min_width_um: 0.60, min_spacing_um: 0.60, min_area_um2: 0.36 }
  metal: { min_width_um: 0.20, min_spacing_um: 0.04, min_area_um2: 0.04 }
  contact: { size_um: 0.22, min_spacing_um: 0.08, enclosure_um: 0.03 }
  via: { size_um: 0.24, min_spacing_um: 0.08, enclosure_um: 0.02 }
  gate_extension_um: 0.20
  well_enclosure_um: 0.30
  # Coarse, deterministic preview fill intended to communicate how an
  # otherwise sparse die may look after density insertion. These are not
  # SKY130 foundry rules. Large tiles keep the interactive 3D scene tractable;
  # a qualified process deck should replace them with its actual window,
  # density, exclusion, slotting, and pattern constraints.
  density_fill:
    format_version: 1
    # Educational local-density evaluation: 400 um square windows at a
    # half-window (200 um) step, mirroring common published deck structure.
    evaluation_window_width_um: 400.0
    evaluation_window_height_um: 400.0
    evaluation_window_step_x_um: 200.0
    evaluation_window_step_y_um: 200.0
    layers:
      # Bounded top-metal dummy islands make the otherwise empty field and
      # pad layer legible without overwhelming an interactive preview.
      metal5:
        target_density: 0.005
        maximum_density: 0.70
        tile_width_um: 10.0
        tile_height_um: 10.0
        fill_spacing_um: 40.0
        circuit_spacing_um: 12.0
        ring_keepout_um: 60.0
  layer_overrides: {}
  via_overrides: {}

physical_planning:
  placement_site_width_um: 0.50
  row_height_um: 1.70
  target_device_density: 0.65
  target_routing_utilization: 0.75
  floorplan_growth_factor: 0.08
  max_floorplan_growth_passes: 3
  global_route_max_iterations: 30
  global_route_stall_iterations: 3
  detailed_route_max_iterations: 10
  routing_layers:
    metal1: { pitch_um: 0.32, offset_um: 0.16, preferred_direction: horizontal, capacity_adjustment: 0.75, reserved_for_power: true }
    metal2: { pitch_um: 0.32, offset_um: 0.16, preferred_direction: vertical, capacity_adjustment: 0.75, reserved_for_power: false }
    metal3: { pitch_um: 0.32, offset_um: 0.16, preferred_direction: horizontal, capacity_adjustment: 0.75, reserved_for_power: false }
    metal4: { pitch_um: 0.32, offset_um: 0.16, preferred_direction: vertical, capacity_adjustment: 0.75, reserved_for_power: false }
    metal5: { pitch_um: 0.32, offset_um: 0.16, preferred_direction: horizontal, capacity_adjustment: 0.75, reserved_for_power: false }
