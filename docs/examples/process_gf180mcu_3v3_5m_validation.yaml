# OpenChippy process-validation record example
#
# This file records what OpenChippy has demonstrated for the exact process
# rule deck named below. It is intentionally separate from the rule deck:
# process requirements must not change when qualification evidence changes.
#
# Claims are deliberately conservative. This compatibility deck is not a
# foundry signoff deck. The official GF180 deck has now been run against the
# exact 4B_ADDER GDS: structural/round-trip checks pass, official geometry and
# process DRC is clean apart from the known direct-float DBU comparison marker,
# and native LVS closes 144 MOS devices and 82 nets. Tapeout, manufacturing,
# and silicon evidence remain NOT_RUN.

